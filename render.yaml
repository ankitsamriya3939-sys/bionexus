services:
  - type: web
    name: bionexus-studio
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: NCBI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
