<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Title & Meta Description -->
    <title>BioNexus Studio | Computational Bioinformatics Platform</title>
    <meta name="description" content="BioNexus Studio is a computational bioinformatics workspace for DNA, RNA and protein sequence analysis, PCR primer design, NCBI exploration, BLAST, multiple sequence alignment and phylogenetics." />
    <meta name="keywords" content="BioNexus Studio, bioinformatics platform, PCR primer design, NCBI exploration, BLAST alignment, DNA sequence analysis, protein 3D viewer, multiple sequence alignment, phylogenetics" />
    <meta name="author" content="BioNexus Studio Team" />
    <meta name="robots" content="index, follow" />

    <!-- Configurable Canonical Link -->
    <link rel="canonical" href="https://bionexusstudio.ai/" />

    <!-- Open Graph / Facebook / LinkedIn Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BioNexus Studio" />
    <meta property="og:title" content="BioNexus Studio | Computational Bioinformatics Platform" />
    <meta property="og:description" content="BioNexus Studio is a computational bioinformatics workspace for DNA, RNA and protein sequence analysis, PCR primer design, NCBI exploration, BLAST, multiple sequence alignment and phylogenetics." />
    <meta property="og:url" content="https://bionexusstudio.ai/" />
    <meta property="og:image" content="https://bionexusstudio.ai/og-image.png" />

    <!-- Twitter Card Social Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BioNexus Studio | Computational Bioinformatics Platform" />
    <meta name="twitter:description" content="BioNexus Studio is a computational bioinformatics workspace for DNA, RNA and protein sequence analysis, PCR primer design, NCBI exploration, BLAST, multiple sequence alignment and phylogenetics." />
    <meta name="twitter:image" content="https://bionexusstudio.ai/og-image.png" />

    <!-- Structured Data (JSON-LD): WebSite, Organization, SoftwareApplication -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BioNexus Studio",
        "url": "https://bionexusstudio.ai/",
        "description": "Computational bioinformatics workspace for DNA, RNA and protein sequence analysis, PCR primer design, NCBI exploration, BLAST, MSA, and phylogenetics."
      },
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BioNexus Studio",
        "url": "https://bionexusstudio.ai/",
        "logo": "https://bionexusstudio.ai/favicon.svg",
        "sameAs": [
          "https://github.com/bionexus"
        ]
      },
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "BioNexus Studio",
        "operatingSystem": "Web",
        "applicationCategory": "EducationalApplication",
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "USD"
        },
        "description": "Unified cloud bioinformatics workspace for DNA/RNA sequence analysis, primer design, BLAST, NCBI search, and 3D protein visualization."
      }
    ]
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 3Dmol.js for 3D Protein Structure Viewer -->
    <script src="https://3dmol.org/build/3Dmol-min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
